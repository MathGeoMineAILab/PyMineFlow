name: wheels

# Builds and tests wheels for CPython 3.10-3.14 ([tool.cibuildwheel] in pyproject.toml) on every push
# and pull request. Publishing only happens on demand (TestPyPI) or when a GitHub Release is published (PyPI).
# Based on the official example of cibuildwheel v4.3.1.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: last x86_64 macOS runner; macos-14: arm64
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.3.1  # builds, repairs and runs pytest on tests/ inside each wheel
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test_sdist:
    name: Install and test the source distribution
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v5.0.0
        with:
          name: cibw-sdist
          path: dist
      - name: Build from the sdist and run its tests
        run: |
          python -m pip install dist/*.tar.gz pytest scipy polars
          mkdir sdist && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          cd sdist && python -m pytest tests -q

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist, test_sdist]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymineflow
    permissions:
      id-token: write  # Trusted Publishing: no tokens or passwords
    steps:
      - uses: actions/download-artifact@v5.0.0
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # running it again with the same version does not fail

  publish-pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, test_sdist]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymineflow
    permissions:
      id-token: write  # Trusted Publishing: no tokens or passwords
    steps:
      - uses: actions/download-artifact@v5.0.0
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ls "dist/pymineflow-${TAG#v}.tar.gz"
      - uses: pypa/gh-action-pypi-publish@v1.14.2
